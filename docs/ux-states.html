<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Shambu state gallery</title>
<style>
:root{font-family:'Segoe UI',system-ui,sans-serif;color:#27382f;background:#f7f8f5;line-height:1.6}*{box-sizing:border-box}body{margin:0}main{max-width:1180px;margin:auto;padding:40px 28px}h1{font-size:28px;font-weight:600;margin:0 0 4px}p{margin:0;color:#657069}nav{display:flex;flex-wrap:wrap;align-items:center;gap:12px;margin:28px 0 20px}select,button{font:inherit;min-height:42px;border:1px solid #b9c5b6;border-radius:7px;padding:7px 12px;background:transparent;color:#27382f}button{cursor:pointer}button:hover{background:#eaf0e4}button:disabled{opacity:.5;cursor:default}:focus-visible{outline:2px solid #3d6548;outline-offset:3px}#state-title{font-size:18px;margin:0 0 4px}#description,#recovery{max-width:82ch}#recovery{color:#27382f;margin-top:8px}figure{margin:24px 0;border-top:1px solid #e0e5de;padding-top:24px}img{display:block;max-width:100%;max-height:850px;width:auto;height:auto;margin:0 auto;border-radius:6px}figcaption{margin-top:18px;font-size:12px;color:#657069;text-align:center}a{color:#3d6548;text-underline-offset:3px}.simulation{font-size:13px;color:#946122;margin-top:12px}footer{border-top:1px solid #e0e5de;margin-top:28px;padding-top:20px;font-size:13px}
</style></head><body><main>
<h1>Shambu state gallery</h1><p>Illustrative screens and recovery paths. These examples use synthetic readings.</p>
<nav aria-label="Choose a preview"><label for="state">State</label><select id="state"></select><button id="recover">Show recovered state</button></nav>
<section aria-live="polite"><h2 id="state-title"></h2><p id="description"></p><p id="recovery"></p><p id="simulation" class="simulation" hidden></p></section>
<figure><img id="preview" width="1120" height="760" alt=""><figcaption>Captured from the app's development preview. No real server data is included.</figcaption></figure>
<footer><a href="ux-states.md">Read the recovery guide</a> · <a href="https://github.com/desigrit/shambu">Shambu on GitHub</a></footer>
</main><script>
const states = [{"id": "healthy", "title": "All ready", "description": "Green dots and Active checks. The connection summary sits just below the heading.", "recovery": "No action needed. Shambu checks again in five minutes."}, {"id": "offline", "title": "Ollama offline", "description": "A red Unreachable status identifies the failing service. Dependent checks remain unverified.", "recovery": "Open Ollama on the GPU PC, or edit the address. Use Check again once the issue is fixed."}, {"id": "tailscale", "title": "Tailscale disconnected", "description": "Local Ollama can be reachable while the private connection needs attention.", "recovery": "Open Tailscale and connect or sign in. For a host-side problem, do this on the GPU PC."}, {"id": "forwarding", "title": "Forwarding missing", "description": "Ollama is working locally, but the route other devices need is missing.", "recovery": "Restore the private TCP forward on the GPU PC using the setup guide, then check again."}, {"id": "pairing", "title": "Pairing key rejected", "description": "The direct Ollama connection still works. Host diagnostics need a valid pairing key.", "recovery": "Choose Update the host pairing key. Copy a current key from Settings on the GPU PC, then save it here."}, {"id": "companion", "title": "Host companion offline", "description": "The server can be reachable while detailed host checks are unavailable.", "recovery": "Check the companion service and its private forward on the GPU PC, and the host status URL in Settings."}, {"id": "cpu", "title": "CPU fallback", "description": "The server responds, but the loaded model has no GPU memory allocation.", "recovery": "Check the driver and model allocation on the GPU PC. Restart Ollama only after its active work finishes."}, {"id": "empty", "title": "No models", "description": "The server is reachable, but the model library is empty.", "recovery": "Open Ollama on the GPU PC, download a model, then check again."}, {"id": "stale", "title": "Stale readings", "description": "Earlier statuses are muted and their age is visible. Shambu does not present them as a fresh all-clear.", "recovery": "Use Refresh now when the connection is available."}, {"id": "remote", "title": "Host not linked", "description": "Direct Ollama access works. Server-side checks remain explicitly unverified.", "recovery": "Choose Link host details and add the optional host pairing key."}, {"id": "mobile-offline", "title": "Phone: Ollama offline", "description": "The same error and recovery actions wrap into the single-column phone layout.", "recovery": "Open Ollama on the GPU PC, then check again from the phone."}, {"id": "mobile-pairing", "title": "Phone: pairing key rejected", "description": "The phone can reach Ollama, but the pairing key for host details needs attention.", "recovery": "Copy a current host pairing key from the GPU PC and update it in Settings."}];
const select = document.getElementById('state');
for(const state of states){const option=document.createElement('option');option.value=state.id;option.textContent=state.title;select.append(option);}
function show(id,simulated=false){
 const state=states.find(item=>item.id===id)||states[0];select.value=state.id;
 document.getElementById('state-title').textContent=state.title;
 document.getElementById('description').textContent=state.description;
 document.getElementById('recovery').textContent=state.recovery;
 const image=document.getElementById('preview');image.src='previews/'+state.id+'.png';image.alt='Shambu example: '+state.title;
 document.getElementById('recover').disabled=state.id==='healthy';
 const note=document.getElementById('simulation');note.hidden=!simulated;note.textContent='Illustrative recovery: after the issue is fixed, a fresh check returns the app to this state.';
}
select.addEventListener('change',()=>show(select.value));
document.getElementById('recover').addEventListener('click',()=>show('healthy',true));
show(location.hash.slice(1)||'healthy');
</script></body></html>
