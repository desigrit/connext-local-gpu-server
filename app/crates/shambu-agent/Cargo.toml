[package]
name = "shambu-agent"
version = "0.1.0"
description = "Read-only private host diagnostics for Shambu"
edition = "2021"

[dependencies]
axum = { version = "0.8", default-features = false, features = ["http1", "json", "tokio"] }
getrandom = "0.3"
readiness = { path = "../readiness" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
subtle = "2.6"
tokio = { version = "1", features = ["net", "sync", "time", "rt-multi-thread", "macros", "signal"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_System_Threading"] }

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
tokio = { version = "1", features = ["test-util"] }
http-body-util = "0.1"