[package]
name = "shambu"
version = "0.1.0"
description = "A quiet window into your local inference server"
edition = "2021"
default-run = "shambu"

[lib]
name = "shambu_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-clipboard-manager = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
readiness = { path = "../crates/readiness" }
tokio = { version = "1", features = ["sync"] }
