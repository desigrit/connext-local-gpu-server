[package]
name = "shambu"
version = "1.0.2"
description = "A quiet window into your local inference server"
edition = "2021"
default-run = "shambu"

[lib]
name = "shambu_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-clipboard-manager = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
readiness = { path = "../crates/readiness" }
tokio = { version = "1", features = ["sync", "process", "time"] }
url = "2"
base64 = "0.22"
minisign-verify = "0.3"
semver = "1"

[target.'cfg(target_os = "android")'.dependencies]
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_Graphics_Dwm"] }

[target.'cfg(any(target_os = "macos", windows, target_os = "linux"))'.dependencies]
tauri-plugin-updater = "2.13.3"

