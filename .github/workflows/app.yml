name: Build readiness app

on:
  push:
    branches: [main]
    paths: ['app/**', '.github/workflows/app.yml']
  pull_request:
    paths: ['app/**', '.github/workflows/app.yml']
  workflow_dispatch:
    inputs:
      release:
        description: 'Prepare a draft GitHub release (Android is signed locally before publication)'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: app-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: app/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: npm ci
      - run: npm run build
      - run: cargo fmt --all --check
      - run: cargo test -p readiness -p shambu-agent -p shambu --locked
      - run: cargo clippy -p readiness -p shambu-agent -p shambu --all-targets --locked -- -D warnings
      - run: npx playwright install chromium
      - run: npm test
      - name: Check existing setup scripts
        working-directory: .
        run: powershell -NoProfile -ExecutionPolicy Bypass -File tests/Validate-Package.ps1

  desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            bundle: nsis
            artifact: Windows-x64
          - os: macos-latest
            target: aarch64-apple-darwin
            bundle: 'app,dmg'
            artifact: Mac-Apple-Silicon
          - os: windows-11-arm
            target: aarch64-pc-windows-msvc
            bundle: nsis
            artifact: Windows-ARM64
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: app
    env:
      APPLE_SIGNING_IDENTITY: '-'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: app/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: 'app -> target'
          key: ${{ matrix.target }}
      - run: npm ci
      - run: npm run tauri -- build --target ${{ matrix.target }} --bundles ${{ matrix.bundle }} --ci
      - name: Stage desktop downloads
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path release-assets -Force | Out-Null
          $platform = '${{ matrix.artifact }}'
          $targetRoot = 'target/${{ matrix.target }}/release'
          if ($IsWindows) {
            Copy-Item -Path "$targetRoot/bundle/nsis/*.exe" -Destination "release-assets/Shambu-$platform-Setup.exe"
          } else {
            Copy-Item -Path "$targetRoot/bundle/dmg/*.dmg" -Destination "release-assets/Shambu-$platform.dmg"
          }
      - uses: actions/upload-artifact@v6
        with:
          name: Shambu-${{ matrix.artifact }}
          path: app/release-assets/*
          if-no-files-found: error
      - name: Prepare macOS in-app update
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p update-assets
          COPYFILE_DISABLE=1 tar -czf update-assets/Shambu-Mac-Apple-Silicon.app.tar.gz -C target/${{ matrix.target }}/release/bundle/macos Shambu.app
      - uses: actions/upload-artifact@v6
        if: runner.os == 'macOS'
        with:
          name: Shambu-Mac-Updater-unsigned
          path: app/update-assets/*.tar.gz
          if-no-files-found: error

  android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: app/package-lock.json
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          # The action default includes the retired "tools" SDK package.
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - name: Install Android build tools
        run: |
          sdkmanager 'platforms;android-36' 'build-tools;36.0.0' 'ndk;28.2.13676358'
          echo "NDK_HOME=$ANDROID_HOME/ndk/28.2.13676358" >> "$GITHUB_ENV"
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: 'app -> target'
          key: android-aarch64
      - run: npm ci
      - run: npm run tauri -- android init --ci --skip-targets-install
      - run: npm run android:prepare
      - run: npm run tauri -- android build --apk --target aarch64 --ci

      - uses: actions/upload-artifact@v6
        with:
          name: Shambu-Android-arm64-unsigned
          path: app/src-tauri/gen/android/app/build/outputs/apk/**/*.apk
          if-no-files-found: error

  release:
    if: github.event_name == 'workflow_dispatch' && inputs.release
    needs: [checks, desktop, android]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          pattern: Shambu-*
          path: artifacts
      - name: Prepare draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version=$(node -p "require('./app/package.json').version")
          mkdir release-assets
          find artifacts -type f \( -name '*-Setup.exe' -o -name '*.dmg' \) -exec cp {} release-assets/ \;
          test "$(find release-assets -type f | wc -l)" -eq 3
          gh release create "v$version" --draft --title "Shambu $version" --target "$GITHUB_SHA" --notes-file "docs/releases/v$version.md" release-assets/*
          echo 'Draft created. Sign the Android artifact locally, verify every download, then publish.'
